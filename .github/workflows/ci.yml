# Checks on every pull request and every push to main:
#   tests   the pytest suite (solver, mesher, aircraft tools, every app page)
#   docker  the server image builds, the 3D kernel compiles, the worker healthcheck runs
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      AEROLAB_EMBEDDED_WORKER: "0"
      AEROLAB_NATIVE_MARCH: x86-64-v2
      NUMBA_CACHE_DIR: /tmp/numba
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt
      - name: Install
        run: pip install -r app/requirements.txt pytest
      - name: Test
        run: python -m pytest -q --durations=20

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg NATIVE_MARCH=x86-64-v2 -t aerolab .
      - name: Worker healthcheck command runs
        # the same command as the aerolab-worker healthcheck in docker-compose.yml; exit 1 (no
        # worker running) is expected here, an import error is not
        run: |
          docker run --rm aerolab python -c "import sys; sys.path.insert(0, 'src'); from aerolab.workflow import jobqueue; jobqueue.worker_alive()"
      - name: 3D kernel compiled
        run: docker run --rm aerolab python -c "import sys; sys.path.insert(0, 'src'); from aerolab.fv3d import native as N; sys.exit(0 if N.lib() is not None else 1)"
